name: "MiCA Programme of Operations - Highlight-Oriented V3"
id: "mica-programme-of-operations-highlight-v3"
system_prompt: |
  ###############################################################################
  AI AGENT INSTRUCTIONS: MiCA Programme of Operations Compliance Review
  Legal basis: Regulation (EU) 2023/1114 (MiCA), Art. 60 & 62, and
  Commission Delegated Regulation (EU) 2025/303 (RTS), Art. 1-11
  ###############################################################################
  AGENT ROLE
  You are a regulatory compliance reviewer assessing whether a submitted
  Programme of Operations (PoO) meets the MiCA requirements for a crypto-asset
  service provider (CASP) licence or notification. Work through each task in
  order. Assess the SUBSTANCE of the document regardless of how its sections
  are titled or ordered -- content may appear under different headings than
  expected. Flag every gap, ambiguity, or non-compliance, citing the specific
  article. Distinguish REQUIRED elements (all applicants) from CONDITIONAL ones
  (only applicable if the applicant declared the relevant service). Do not
  penalise omission of a conditional section the applicant clearly does not need.
  This V3 template is designed for precise remediation and future text
  highlighting. Treat each task as a narrow supervisory requirement. Prefer exact
  section-level findings over broad summaries. If a requirement is partially met,
  identify the exact deficient passage. If a requirement is fully missing,
  identify the nearest existing section where the missing content should logically
  be added. Do not allow weakness in one topic to contaminate unrelated topics.
  Where a task is conditional and genuinely out of scope, say so clearly and do
  not treat that as a deficiency.
  When a task fails, provide remediation-ready issue details in the final
  `Issues` array required by the evaluator output contract: the problem, a
  concrete solution, where the fix should be inserted, and document-specific
  example text that can be inserted by the frontend.
  ###############################################################################

  ==============================================================================
  AVAILABLE REGULATORY REFERENCES (use GetLegislation tool to retrieve)
  ==============================================================================
  R1:  Art. 60 Eligible Entity Types
  R2:  Art. 60 Service Equivalence Map (MiFID II investment firms)
  R3:  Art. 67 Prudential Capital Minimums
  R4:  Art. 73 Outsourcing Key Requirements
  R5:  Art. 75 Custody Obligations
  R6:  Travel Rule Requirements (Regulation (EU) 2023/1113)
  R7:  DORA-Aligned ICT Requirements (Regulation (EU) 2022/2554)
  R8:  AML/CTF Framework Requirements (Directive (EU) 2015/849)
  R9:  Fit and Proper -- Management Body (Art. 62(2)(g), Art. 62(3)(a)-(b))
  R10: Qualifying Holders (Art. 62(2)(h), Art. 62(3)(c))

  Use GetLegislation(reference_ids) to retrieve the full text of specific
  references BEFORE evaluating tasks that cite them (e.g. [R1], [R3]).
  Only fetch the references you need for the current task.

references:
  R1:
    title: "Art. 60 Eligible Entity Types"
    text: |
      Entities that may notify under Art. 60 instead of applying under Art. 62,
      but ONLY for services equivalent to their existing authorisation:
      - Credit institutions (authorised under Directive 2013/36/EU, CRD IV)
        => may provide ALL crypto-asset services
      - Investment firms (authorised under Directive 2014/65/EU, MiFID II)
        => may provide equivalent services (see R2 for mapping)
      - E-money institutions (authorised under Directive 2009/110/EC, EMD2)
        => custody & administration, exchange for funds/crypto,
           reception & transmission, execution of orders, transfer services
      - Payment institutions (authorised under Directive 2015/2366/EU, PSD2)
        => exchange for funds, reception & transmission, transfer services
      - UCITS management companies (Directive 2009/65/EC)
        => advice on crypto-assets, portfolio management on crypto-assets
      - AIFMs (authorised under Directive 2011/61/EU)
        => advice on crypto-assets, portfolio management on crypto-assets
      - Market operators (authorised under MiFID II Art. 4(1)(18))
        => operation of a trading platform for crypto-assets
      An entity that does NOT fall into any category above CANNOT use Art. 60
      and must submit a full Art. 62 application.
  R2:
    title: "Art. 60 Service Equivalence Map (for MiFID II investment firms)"
    text: |
      MiCA service                             MiFID II equivalent
      (A) Custody & administration          => Annex I, Section B, point (1)
      (B) Operation of trading platform     => Operation of MTF or OTF
                                               (Art. 4(1)(22)/(23))
      (C) Exchange for funds                => Dealing on own account,
                                               Annex I, Section A, point (3)
      (D) Exchange for other crypto-assets  => Dealing on own account,
                                               Annex I, Section A, point (3)
      (E) Execution of orders               => Annex I, Section A, point (2)
      (G) Reception & transmission          => Annex I, Section A, point (1)
      (F) Placing of crypto-assets          => Annex I, Section A, point (6) or (7)
      (H) Advice on crypto-assets           => Annex I, Section A, point (5)
      (I) Portfolio management              => Annex I, Section A, point (4)
      (J) Transfer services                 => No MiFID II equivalent --
                                               only available to EMI/PSP under Art. 60
      Note: Any MiCA service with no equivalent in the entity's existing
      authorisation cannot be notified under Art. 60 and requires a separate
      Art. 62 authorisation.
  R3:
    title: "Art. 67 Prudential Capital Minimums"
    text: |
      The applicant must at all times hold own funds or initial capital at least
      equal to the highest applicable floor based on ALL services declared:
      EUR 50,000  => providing ONLY: advice (H), reception & transmission (G),
                     portfolio management (I), or any combination of these three
      EUR 125,000 => providing any of: execution of orders (E), exchange for
                     funds (C), exchange for crypto-assets (D), placing (F),
                     transfer services (J), custody & administration (A)
      EUR 150,000 => operating a trading platform (B)
      If services from multiple tiers are declared, the highest threshold applies.
      Additionally, the CASP must at all times hold own funds of at least
      one-quarter of the fixed overheads of the preceding year, whichever of the
      floor and the overheads calculation is higher.
  R4:
    title: "Art. 73 Outsourcing Key Requirements"
    text: |
      When outsourcing critical or important operational functions, the CASP must:
      - Retain full regulatory responsibility; outsourcing does not transfer
        compliance obligations to the provider
      - NOT outsource to a degree that renders the entity a shell company or
        impairs the management body's ability to oversee the activity
      - Execute a written agreement per provider that defines: scope and SLAs,
        audit rights for both the CASP and the competent authority, data
        protection and confidentiality obligations, and termination provisions
      - Conduct and document due diligence before engaging a provider of
        critical or important functions
      - Maintain and test a documented exit strategy covering each critical
        outsourced function
      - Ensure the competent authority retains unimpaired supervisory access
      - Avoid providers in third countries where data access or enforcement
        would be materially impaired
      "Critical or important function" means any function whose defective or
      failed execution would materially impair: continuous regulatory compliance;
      financial performance; or the soundness and continuity of services.
  R5:
    title: "Art. 75 Custody Obligations"
    text: |
      A CASP providing custody and administration of crypto-assets must:
      - Maintain a custody policy describing operational and ICT risk sources
        and the risk management systems addressing them
      - Hold adequate arrangements (insurance, capital reserves, or equivalent)
        to cover the risk of loss of private cryptographic keys or operational errors
      - Keep individual records per client; reconcile client positions at least daily
      - Segregate client crypto-assets from own assets at wallet/account level
      - NEVER use client crypto-assets for own-account purposes under any circumstances
      - Provide clients at least monthly with a statement of holdings and transactions
      - Have procedures for return of client crypto-assets in insolvency/wind-down
      - Where delegating to sub-custodians: conduct prior due diligence; verify
        regulatory status; monitor on an ongoing basis; retain liability for
        delegate-caused losses; prohibit further sub-delegation without prior approval
  R6:
    title: "Travel Rule Requirements (Regulation (EU) 2023/1113)"
    text: |
      For every crypto-asset transfer (no de minimis threshold applies):
      Originating CASP must transmit to beneficiary CASP:
      - Originator full name (legal name for entities, personal name for individuals)
      - Originator DLT address (blockchain address) or account identifier
      - For transfers exceeding EUR 1,000: originator's postal address, national
        ID number, customer identification number, or date and place of birth
      Beneficiary CASP must obtain:
      - Beneficiary full name
      - Beneficiary DLT address or account identifier
      The CASP must screen originator and beneficiary against sanctions lists before
      processing. It must have risk-based procedures for self-hosted wallet transfers
      to determine whether the self-hosted wallet belongs to the CASP's own client.
      Controls must handle incomplete, missing, or suspicious travel rule data
      (reject, freeze, file STR as applicable).
  R7:
    title: "DORA-Aligned ICT Requirements (Regulation (EU) 2022/2554 key elements)"
    text: |
      A CASP must have an ICT risk management framework that includes:
      - A documented ICT risk policy identifying: all ICT assets (hardware, software,
        data, cloud services), the threat landscape, and the entity's risk tolerance
      - Processes for continuous ICT risk identification, assessment, and mitigation
      - Documented Recovery Time Objectives (RTO) and Recovery Point Objectives (RPO)
        for critical ICT systems
      - An ICT incident management process: detection (monitoring and alerting),
        classification by severity, escalation, and root-cause analysis
      - Regulatory incident reporting: major ICT incidents reported to the competent
        authority within 4 hours of classification as major, with an intermediate
        report within 72 hours and a final report within one month
      - Digital operational resilience testing: scenario-based testing of critical
        ICT systems at least annually; penetration testing at least annually for
        systems supporting critical or important functions
      - ICT third-party risk management: register of all ICT providers, contractual
        protections (audit rights, data portability, exit provisions), assessment of
        concentration risk where one provider supports multiple critical functions
      Note: Entities below the DORA microenterprise threshold (fewer than 10 staff
      AND either less than EUR 2m annual turnover or less than EUR 2m balance sheet
      total) benefit from a simplified regime but must still have a basic ICT risk
      framework and an incident response procedure.
  R8:
    title: "AML/CTF Framework Requirements (Directive (EU) 2015/849 as amended)"
    text: |
      The CASP must have a risk-based AML/CTF framework that includes:
      - A documented business-wide risk assessment identifying ML/TF risks specific
        to crypto-asset services: transaction anonymity, cross-border flows, mixer
        and tumbler exposure, smart contract interactions, high-risk jurisdictions
      - Customer due diligence (CDD) at onboarding: verification of client identity,
        beneficial ownership (UBOs holding >= 25% of a legal entity), purpose of
        business relationship, and source of funds
      - Enhanced due diligence (EDD) for: politically exposed persons (PEPs), clients
        from FATF high-risk third countries, and relationships flagged as high-risk
      - Ongoing transaction monitoring: automated screening for unusual patterns;
        risk-based frequency of relationship reviews
      - Sanctions screening: real-time screening against EU, UN, and applicable
        national sanctions lists for all clients, beneficial owners, and counterparties;
        documented procedures for handling hits
      - Suspicious transaction reporting (STR): documented escalation path to the MLRO
        and, where appropriate, to the national Financial Intelligence Unit (FIU)
      - Designated MLRO with documented authority, independence, and direct reporting
        line to the management body; authority to file STRs independently
      - Annual AML/CTF training for all relevant staff
      - Record retention: all CDD documentation and transaction records kept for
        at least five years
  R9:
    title: "Fit and Proper -- Management Body (Art. 62(2)(g) and Art. 62(3)(a)-(b))"
    text: |
      For EVERY member of the management body, the applicant must demonstrate:
      - Absence of criminal convictions in: commercial law, insolvency law,
        financial services law, AML/CTF, fraud, and professional liability
      - Absence of regulatory sanctions, enforcement orders, or disqualifications
        from holding management positions in regulated entities
      - No pending criminal investigations (as known at time of application)
      Collectively, the management body must demonstrate:
      - Adequate knowledge of: crypto-asset markets, applicable law (MiCA, AMLD,
        DORA, consumer protection), risk management, internal control frameworks,
        and financial management
      - Sufficient time commitment by each member to perform their duties
      - Diversity of skills such that no single individual's absence creates an
        unmanageable key-person dependency
  R10:
    title: "Qualifying Holders (Art. 62(2)(h) and Art. 62(3)(c))"
    text: |
      A "qualifying holding" is a direct or indirect holding of 10% or more of
      the capital or voting rights of the applicant entity.
      The applicant must disclose:
      - The identity of every qualifying holder (natural or legal person)
      - The size of each qualifying holding (percentage and absolute amount)
      For each qualifying holder, the applicant must demonstrate:
      - Absence of criminal convictions in: commercial law, insolvency law,
        financial services law, AML/CTF, fraud, and professional liability
      - Absence of regulatory sanctions or disqualifications
      If there are no qualifying holders other than management body members already
      covered under R9, the document must explicitly state this.

Tasks_v1_archived:

  - - "TASK 1: Pre-check -- Scope, Route, and Service Declaration"
    - "Determine whether the submission follows the Art. 60 notification route or
      the Art. 62 authorisation route. Use [R1] to verify the route is correct:
      confirm the entity type matches one of the eligible categories in [R1]. If
      Art. 60 is claimed but the entity type is not listed in [R1], flag this as
      a material non-compliance -- the entity must submit an Art. 62 application
      instead. Record the determined route as it affects which requirements apply."
    - "Identify and list every crypto-asset service the applicant declares it
      intends to provide. The complete list of MiCA crypto-asset services is:
      (A) custody and administration of crypto-assets on behalf of clients;
      (B) operation of a trading platform for crypto-assets;
      (C) exchange of crypto-assets for funds;
      (D) exchange of crypto-assets for other crypto-assets;
      (E) execution of orders for crypto-assets on behalf of clients;
      (F) placing of crypto-assets;
      (G) reception and transmission of orders for crypto-assets on behalf of clients;
      (H) providing advice on crypto-assets;
      (I) portfolio management on crypto-assets;
      (J) providing transfer services for crypto-assets on behalf of clients.
      Create a declared-services checklist (A-J: Yes/No). This drives which
      conditional tasks are applicable throughout the review."
    - "Check that the document explicitly states the three-year planning horizon
      required by the RTS. Flag if this horizon is absent, shorter than three
      years, or inconsistently applied across different forward-looking sections."
    - "Verify that the document references the correct legal bases: Regulation (EU)
      2023/1114 (MiCA) and Commission Delegated Regulation (EU) 2025/303 (RTS).
      For Art. 60 notifications, the specific paragraph Art. 60(7) should also
      be cited."
    - "CONDITIONAL -- if route is Art. 60: for each declared service, apply the
      equivalence map in [R2] to verify whether a valid equivalent exists in the
      entity's existing authorisation. For each service, record: CONFIRMED
      (equivalence cited with specific MiFID II or directive annex reference),
      ASSERTED (equivalence claimed but no specific annex reference cited), or
      ABSENT (no equivalence claimed or identifiable). An ABSENT service is a
      material gap requiring an Art. 62 application for that service."

  - - "TASK 2: Introduction and Legal Basis (REQUIRED)"
    - "Verify that the document states its purpose clearly and identifies itself
      as a Programme of Operations prepared for supervisory review under MiCA."
    - "Check that the entity's legal status and existing authorisations are
      described: the authorising directive (e.g. MiFID II), the supervising
      competent authority, and the date of authorisation. For Art. 60 notifications
      this is essential because the notification right is conditional on the
      existing licence. Flag if absent or vague."
    - "Confirm that the document explains the relationship between planned
      crypto-asset services and any existing regulated activities, and that it
      states the two frameworks will operate in parallel with clear internal
      demarcation -- no regulatory overlap or dilution of controls."
    - "For Art. 60 notifications: flag if the document describes the submission
      as a new authorisation application rather than a notification, or if it
      fails to state that the entity is exercising the right to notify under
      Art. 60 MiCA."
    - "Flag any blanket claim of equivalence between MiFID II and MiCA services
      that is not substantiated per-service with the specific MiFID II annex
      reference. General statements like 'our MiFID II licence covers all these
      services' without per-service mapping are insufficient."

  - - "TASK 3: Structure and Strategy (Art. 1(1)(a)-(b) RTS) -- REQUIRED"
    - "Verify that the entity's legal structure is described: full legal name,
      legal entity identifier (LEI) or equivalent, registered address,
      jurisdiction of establishment, legal form, and full ownership structure
      including direct and indirect shareholders and the ultimate beneficial
      owner (UBO)."
    - "Check whether the entity is standalone or part of a corporate group. If
      part of a group: verify that intra-group relationships relevant to
      crypto-asset services are disclosed (shared treasury, group ICT
      infrastructure, intra-group outsourcing, group AML functions, shared brand
      or website). If standalone: verify the document explicitly states this and
      that all services are provided directly by the notifying entity."
    - "Confirm that the strategic rationale for entering crypto-asset services is
      explained -- how the services fit the broader business strategy, whether they
      are a standalone business line or an extension of existing activities, and
      the competitive or client-driven rationale."
    - "Verify that affiliated entities (subsidiaries, sister companies, tied
      agents, white-label partners, appointed representatives) relevant to service
      provision are identified. If none exist, the document must explicitly state
      this."
    - "Check that the document lists all regulated and non-regulated activities
      the entity carries out or plans to carry out alongside crypto-asset services.
      Each activity must be attributed to its applicable regulatory framework or
      explicitly flagged as non-regulated. Activities such as staking, DeFi
      interactions, or NFT-related services must be clearly distinguished from
      MiCA-regulated services."

  - - "TASK 4: Planned Crypto-Asset Services (Art. 1(1)(c)-(e) RTS) -- REQUIRED"
    - "Verify that each service from the Task 1 declared-services checklist is
      described individually and operationally: what the service entails, how it
      will be delivered (OTC, via a platform, through tied agents, etc.), and how
      it leverages or extends the entity's existing capabilities and infrastructure."
    - "Check that the document states which types of crypto-assets are within scope:
      non-EMTs (e.g. BTC, ETH), asset-referenced tokens (ARTs), e-money tokens
      (EMTs), or a defined subset. If the entity does NOT intend to issue ARTs or
      EMTs, verify this is explicitly stated."
    - "Check that the document addresses which MiCA services the entity does NOT
      intend to provide. Explicit exclusions reduce supervisory ambiguity. Flag if
      no such statement is made."
    - "If the applicant plans ancillary non-MiCA activities (staking, DeFi, NFTs):
      verify they are clearly distinguished from MiCA-regulated services, and that
      the document explains how conflicts of interest, asset segregation, and client
      disclosure obligations will be managed for those activities separately."
    - "CONDITIONAL -- Art. 60 entities only: for each declared service, confirm
      that the per-service equivalence mapping from [R2] is present in the document
      with the specific MiFID II (or other directive) annex reference cited. An
      equivalence asserted without citing the specific annex reference is a gap."

  - - "TASK 5: Governance, Fit & Proper, and Qualifying Holders
      (Art. 62(2)(f)-(h), Art. 62(3) MiCA) -- REQUIRED"
    - "Verify that the governance structure is described: composition and role of
      the management body, reporting lines, segregation of duties between executive
      and non-executive members, and the allocation of responsibilities between
      board and senior management."
    - "Using [R9] as the benchmark, check that the management body's collective
      competence is addressed: absence of disqualifying criminal or regulatory
      history for each member; coverage of key competencies (crypto-asset markets,
      applicable law, risk management, internal controls, financial management);
      and confirmation of sufficient time commitment. Each member should be
      individually identifiable or, where the document is anonymised, described
      with their role and background sufficient for assessment."
    - "Verify that key function holders beyond the board are identified: at minimum
      the MLRO, Compliance Officer, Risk Manager, and ICT/Information Security
      Officer. For each, check that reporting lines and independence from commercial
      functions are stated."
    - "Apply [R10] to check qualifying holder disclosure: identify any holder of
      10% or more of capital or voting rights; verify identity and holding size are
      disclosed; verify absence of disqualifying criminal or regulatory history is
      asserted. If there are no qualifying holders beyond management body members
      already disclosed, the document must explicitly state this."
    - "For Art. 60 entities: verify the document states that the existing supervisor
      has already assessed the management body as fit and proper under the existing
      authorisation, and confirms no new disqualifying events have occurred since."
    - "Flag if the document lists management roles without any description of the
      individuals' backgrounds or qualifications -- role titles alone are
      insufficient."

  - - "TASK 6: Complaints Handling (Art. 62(2)(l) MiCA) -- REQUIRED"
    - "Verify that the entity's complaints-handling procedures are described. Check
      coverage of: channels for submitting complaints (written, online, in-person),
      the acknowledgement timeline, the investigation and resolution process,
      escalation paths for unresolved complaints, and the maximum timeframe for a
      final response."
    - "Check that the document states whether an alternative dispute resolution (ADR)
      mechanism is available to clients, and if so which body administers it."
    - "Verify that the document describes how complaints are recorded, tracked, and
      used to identify systemic issues or recurring failures -- i.e. that complaints
      data feeds into internal quality improvement and compliance monitoring."
    - "Flag if complaints handling is mentioned only in passing (e.g. 'a complaints
      policy exists') without any substantive description of the actual process."

  - - "TASK 7: Geographic Scope and Target Clients (Art. 1(1)(f)-(h) RTS) -- REQUIRED"
    - "Check that all EU Member States in which crypto-asset services will be
      provided at launch are listed. For Art. 60 notifications, verify that the
      geographic scope does not exceed the entity's existing passporting footprint
      without explanation. If expansion beyond the current footprint is planned,
      check that the document explains the basis and timing."
    - "Verify that the document provides projected client numbers or ranges by
      Member State for the three-year horizon, together with the key assumptions
      underlying those projections (e.g. conversion rate from existing client base,
      new client acquisition rate per channel)."
    - "Confirm that the types of prospective clients are identified: retail,
      professional, institutional. Where retail clients are targeted, check that
      the document describes suitability or appropriateness measures applicable to
      retail clients under MiCA conduct-of-business rules."
    - "Check that all means of client access are described: websites (with domain
      names), mobile applications (with names and supported languages), physical
      offices if any, tied agents and appointed representatives. For digital-only
      providers, verify language coverage per interface is addressed and is
      consistent with the Member States listed."
    - "Verify that the document confirms whether or not the entity operates physical
      branches. If services are provided exclusively online, confirm that cross-border
      digital delivery is addressed."

  - - "TASK 8: Marketing and Promotional Activities (Art. 1(1)(i) RTS) -- REQUIRED"
    - "Verify that the document describes the marketing channels to be used, mapped
      per crypto-asset service: owned digital channels, paid media, tied agent or
      partner distribution, app stores. A generic statement that 'marketing will be
      conducted' without channel detail is insufficient."
    - "Check that the document states that all marketing communications will be fair,
      clear, and not misleading, and that a compliance review and approval process
      for marketing materials is described before publication."
    - "Confirm that the document specifies how the entity will be identified in all
      marketing materials: legal name, regulatory status (notifying under Art. 60 or
      authorised under Art. 59 MiCA), and contact information. If third-party
      distributors or white-label interfaces are used, verify the document confirms
      those channels will still clearly identify the licensed entity as the provider."
    - "Check that languages used for marketing are listed and mapped to Member States,
      consistent with the geographic scope in Task 7."
    - "Flag any description of marketing that promises or implies guaranteed returns,
      claims crypto-assets are low-risk, or describes staking rewards as equivalent
      to interest on bank deposits -- such content is non-compliant with MiCA
      conduct-of-business rules."

  - - "TASK 9: Resources -- Human, Financial, and ICT (Art. 1(1)(j)-(l) RTS) -- REQUIRED"
    - "Verify that the current organisational structure is described: the management
      body, all key function holders (compliance, risk, AML, ICT/information security,
      finance, operations), their physical location, and whether each function is
      staffed internally or fulfilled by an outsourced provider."
    - "Check that a three-year headcount plan is provided showing: staff allocated to
      crypto-asset services broken down by function (business, control, support),
      the timeline for hiring, and the key assumptions driving headcount growth."
    - "Verify that the document addresses the applicable prudential capital floor from
      [R3]: (a) identify which tier applies given the declared services, (b) confirm
      current or projected own funds meets or exceeds that tier's threshold, and (c)
      confirm a mechanism is described for monitoring ongoing compliance with the
      fixed-overheads requirement. Flag if the capital floor is not mentioned at all."
    - "Check that ICT resources supporting crypto-asset services are described:
      internal vs. third-party or cloud infrastructure, custody and wallet technology,
      and integration with existing platforms."
    - "OUTSOURCING: Verify that all outsourcing arrangements supporting crypto-asset
      services are identified and classified as critical/important or non-critical
      using the definition in [R4]. For each critical/important outsourced function,
      check: (a) a written agreement framework is described with scope, SLAs, audit
      rights, data protection, and termination provisions; (b) due diligence
      procedures are described; (c) an exit strategy and continuity plan are in
      place; (d) the competent authority's supervisory access is not impaired. Flag
      any arrangement where a critical function is fully outsourced with no retained
      governance or oversight capacity at the entity level."

  - - "TASK 10: Financial Forecasts (Art. 1(1)(m)-(n) RTS) -- REQUIRED"
    - "Verify that the document includes a three-year financial forecast covering
      the period from notification/authorisation. The forecast must include:
      projected revenues from crypto-asset services (broken down by service type
      if material), projected operating costs, and projected profit/loss. A historic
      P&L and balance sheet (or summary) must also be present to establish the
      baseline."
    - "Check that the forecast is accompanied by key assumptions: client growth
      rates, fee levels per service, cost inflation, headcount scaling milestones,
      and timing of service launches. Verify these are internally consistent with
      the client projections in Task 7 and the headcount plan in Task 9."
    - "Confirm that at least one stress scenario is provided simulating adverse
      conditions plausible for the entity's specific business model. For crypto-
      asset service providers, adequate stress scenarios include at least one of:
      significant crypto-asset market value decline (e.g. >50% price correction);
      major operational or ICT disruption; sharp client attrition; regulatory
      enforcement action or licence suspension. Verify the scenario quantifies
      impact on revenue, capital adequacy, and liquidity."
    - "Check that the source of funding for initial capital and ongoing costs is
      disclosed -- equity, retained earnings, or external financing -- and that it
      is credible and consistent with the prudential requirements in [R3]."
    - "CONDITIONAL -- if service (C) or (D) is declared (exchange on own account):
      verify that the forecasts separately address own-account treasury exposure,
      hedging costs, and inventory management."
    - "CONDITIONAL -- if intra-group funding or loans exist: verify disclosure of
      terms and confirmation that they do not create regulatory capital double-
      counting or group contagion risk."

  - - "TASK 11: Business Continuity Plan (Art. 2 RTS) -- REQUIRED"
    - "Verify that a Business Continuity Plan (BCP) is described including: a
      Business Impact Analysis (BIA) identifying the entity's critical functions,
      and documented Recovery Time Objectives (RTO) and Recovery Point Objectives
      (RPO) for each critical function."
    - "Check that ICT-specific continuity is addressed: data backup procedures,
      failover and redundancy mechanisms, recovery procedures for core systems
      (client records, wallets, transaction processing, reporting), and alignment
      with the ICT continuity requirements in [R7] (RTO/RPO documentation, at
      minimum annual testing of critical systems)."
    - "Confirm that the BCP covers third-party and outsourcing failure scenarios:
      what happens if a critical service provider (custody infrastructure, ICT
      hosting, AML monitoring, key management) fails or becomes unavailable.
      Verify this ties back to the exit strategies in Task 9."
    - "Verify that BCP testing and maintenance are described: frequency of tests
      (at minimum annually for full BCP, more frequently for ICT failover), format
      of tests (tabletop, simulation, live failover), and the process for updating
      the BCP following material changes in services, infrastructure, or providers."
    - "Check that a wind-down section describes how client assets and funds would
      be returned to clients if the entity ceases operations -- including
      identification of the responsible party and estimated timeline."

  - - "TASK 12: AML/CTF Framework (Art. 3 RTS) -- REQUIRED"
    - "Verify that the AML/CTF framework meets the requirements in [R8]: business-
      wide risk assessment, CDD procedures, EDD for high-risk clients (PEPs, FATF
      high-risk country clients), ongoing transaction monitoring, sanctions
      screening, an STR escalation process, a designated MLRO, staff training, and
      five-year record retention. Each element must be substantively described, not
      merely listed."
    - "Check that the risk assessment addresses crypto-asset-specific ML/TF risk
      vectors: transaction anonymity (privacy coins, mixers, tumblers), cross-border
      and cross-chain transfers, smart contract interactions, DeFi exposure, and the
      entity's own client base risk profile. A generic AML framework without crypto-
      asset adaptation is insufficient."
    - "Verify that travel rule compliance is described using [R6] as the benchmark:
      the entity must confirm it transmits originator information (name, DLT address,
      and for transfers >EUR 1,000 address/ID/DoB) to the beneficiary CASP for every
      transfer; that it obtains beneficiary information for every incoming transfer;
      and that it has risk-based procedures for self-hosted wallet transfers.
      A statement that the entity 'complies with applicable law' without procedural
      detail is insufficient."
    - "Confirm that the MLRO role is identified with: their reporting line (direct
      access to the management body), their authority to file STRs independently of
      management, and whether the role is internal or outsourced."
    - "Flag if the AML section relies entirely on a third-party technology platform
      (KYC/transaction monitoring SaaS) without describing the entity's own
      governance, oversight, and decision-making responsibilities. Technology tools
      support compliance; they do not replace the entity's AML framework."

  - - "TASK 13: ICT Systems and Security Arrangements (Art. 4 RTS) -- REQUIRED"
    - "Verify that technical documentation of the ICT architecture is provided,
      covering: core infrastructure (servers, hosting, cloud providers, network
      topology), crypto-asset-specific systems (wallet infrastructure, blockchain
      connectivity, key management systems), and back-office systems (client
      records, reporting, reconciliation, monitoring)."
    - "Check that a non-technical summary of ICT systems and cybersecurity controls
      is included and is genuinely accessible to a non-technical reader -- it must
      explain in plain language what systems are used, how client assets are
      protected, and what happens in the event of a security incident. This is a
      distinct deliverable from the technical documentation."
    - "Verify that the ICT risk management framework meets [R7]: a documented ICT
      risk policy, processes for continuous risk identification and assessment,
      documented RTO/RPO for critical ICT systems, ICT incident management with
      severity classification, and DORA-aligned reporting timelines (major incidents
      reported within 4 hours of classification)."
    - "Check that the document identifies critical or important ICT functions and
      all third-party ICT providers supporting them. Verify that concentration risk
      is assessed: the impact of a single provider failure on multiple critical
      functions simultaneously."
    - "Verify that the cybersecurity assurance programme is described: penetration
      testing (at least annually for critical systems), vulnerability assessments,
      and configuration reviews; and whether performed by internal team or external
      specialist. CONDITIONAL -- if smart contracts are used: smart contract code
      review must be included."
    - "Check that incident management covers: automated detection and alerting,
      severity classification criteria (at minimum distinguishing major from minor
      incidents), escalation and client/authority communication procedures, and
      post-incident review."

  - - "TASK 14: Segregation and Safekeeping of Client Assets and Funds
      (Art. 5 RTS) -- REQUIRED"
    - "Verify that the document describes the legal and operational prohibition on
      using client crypto-assets or client fiat funds for own-account purposes, and
      the specific controls that enforce this prohibition (system-level controls,
      reconciliation processes, independent oversight)."
    - "Check that client-to-client segregation is addressed: how the entity ensures
      that one client's assets cannot be used to cover liabilities or shortfalls
      attributable to another client -- covering both the wallet-level architecture
      (individual vs. omnibus wallets) and the accounting/record-keeping layer."
    - "Verify that the cryptographic key management model is described: key
      generation method (HSM, MPC, multi-sig), key storage architecture (hot vs.
      cold split with approximate percentages), backup and recovery procedures,
      multi-party approval workflows for fund movements, and key rotation policy."
    - "Confirm that fiat fund segregation is described: the account structure at
      credit institutions, the legal characterisation of client funds (held on trust
      or equivalent), the procedure for selecting and monitoring credit institutions,
      and how those institutions are informed that the funds belong to clients."
    - "Check that clients are informed of safeguarding arrangements: how and when
      clients receive information about where and how their assets are held, any
      sub-custodian relationships, and protections in the event of insolvency."

  - - "TASK 15: Custody and Administration Policy (Art. 6 RTS) -- CONDITIONAL (A)"
    - "SKIP THIS TASK if service (A) custody and administration has NOT been declared."
    - "Verify that a custody and administration policy is described meeting [R5]:
      operational and ICT risk sources specific to custody, the risk management
      systems addressing them, and whether the entity holds insurance, capital
      reserves, or equivalent arrangements to cover loss-of-key or operational
      error risk."
    - "Check that individual client record-keeping is described (at minimum daily
      reconciliation); that the identification of client crypto-assets and means of
      access is explained; and that loss minimisation arrangements are specified.
      Verify the policy addresses what happens at forks, airdrops, and other events
      generating rights attached to held crypto-assets."
    - "Confirm that delegation to sub-custodians is addressed per [R5]: prior due
      diligence on the delegate, verification of regulatory status, ongoing
      monitoring, retention of liability for delegate-caused losses, and prohibition
      of further sub-delegation without prior approval."
    - "Verify that crypto-asset deposit and withdrawal procedures are described: how
      incoming deposits are identified, credited, and reconciled; how withdrawal
      requests are authenticated, approved (multi-party thresholds), executed, and
      confirmed to the client."

  - - "TASK 16: Trading Platform Rules and Market Abuse (Art. 7 RTS) -- CONDITIONAL (B)"
    - "SKIP THIS TASK if service (B) operation of a trading platform has NOT been
      declared."
    - "Verify that platform operating rules are described: admission criteria for
      crypto-assets to be listed (minimum liquidity, disclosure standards, whitepaper
      requirements), listing and de-listing procedures, participant access rules
      (eligibility criteria, KYC requirements), order types supported, and fee
      structures."
    - "Check that a market surveillance and abuse detection system is described,
      capable of detecting at minimum: wash trading (simultaneous buy/sell by related
      parties), spoofing and layering (placing and withdrawing orders to create false
      price signals), and front-running. Verify that alerts are described and that
      the escalation path to compliance and the competent authority is stated."
    - "Confirm that the document describes procedures for handling suspicious
      transaction alerts from surveillance: how alerts are reviewed, what triggers
      an STR to the national FIU, and how the platform cooperates with competent
      authority investigations."

  - - "TASK 17: Exchange of Crypto-Assets (Art. 8 RTS) -- CONDITIONAL (C and/or D)"
    - "SKIP THIS TASK if neither service (C) exchange for funds nor service (D)
      exchange for other crypto-assets has been declared."
    - "Verify that a non-discriminatory commercial policy is described: the criteria
      for client eligibility, any volume or size thresholds, and confirmation that
      access is not refused on grounds unrelated to regulatory compliance or risk."
    - "Check that the pricing methodology is described: how exchange rates or prices
      are determined (reference to external price feed, own inventory valuation,
      spread policy), the basis on which fees and spreads are set, and how pricing
      is disclosed to clients before execution."
    - "Verify that execution mechanics are described: how client exchange requests
      are received and processed, how own-account inventory is managed, how liquidity
      is sourced (own inventory, liquidity providers, market), and how hedging or
      offsetting transactions reduce market risk."
    - "Check that the document identifies conflicts of interest from dealing on own
      account (principal trading) and describes how fair pricing and equal treatment
      of clients are maintained, particularly when the entity is the direct
      counterparty."

  - - "TASK 18: Execution of Orders (Art. 9 RTS) -- CONDITIONAL (E)"
    - "SKIP THIS TASK if service (E) execution of orders has NOT been declared."
    - "Verify that an order execution policy is described covering: execution venues
      and counterparties used; best execution factors (price, costs, speed,
      likelihood of execution, size, nature of order); and their relative weighting
      for different client types and order sizes."
    - "Check that OTC execution is specifically addressed if that is the primary
      method -- verify the entity explains how best execution is demonstrated
      without centralised exchange prices, including the reference pricing
      methodology used to assess execution quality."
    - "Confirm that client consent to the execution policy is described: pre-
      contractual disclosure, client acknowledgement mechanism, and notification
      process for material updates."
    - "Verify that the document describes: protection of client order information
      from misuse (front-running prohibition, information barriers if the entity
      also deals on own account); handling of any inducements received from
      execution venues or liquidity providers; and the process for monitoring
      execution quality and venue performance on an ongoing basis."

  - - "TASK 19: Service-Specific Procedures -- Reception & Transmission / Placing
      (Art. 1(2)-(3) RTS) -- CONDITIONAL (F and/or G)"
    - "SKIP THIS TASK if neither service (F) placing nor service (G) reception and
      transmission has been declared."
    - "CONDITIONAL -- if service (G) reception and transmission is declared: verify
      that the document describes the full transmission process -- how client orders
      are received, the counterparties or execution venues to which they are
      transmitted, the criteria for selecting those counterparties, and how the
      entity demonstrates it acts in the client's best interest in transmission.
      Confirm the entity does NOT hold client funds or crypto-assets as part of
      this service (which would convert it into execution of orders)."
    - "CONDITIONAL -- if service (F) placing is declared: verify that the document
      describes the placing process -- types of issuances or offerings for which
      placing is provided, how clients are identified and approached, how conflicts
      of interest between issuer and client are managed, and what disclosures are
      made to clients prior to placing. Check that the entity addresses how it
      avoids marketing unsuitable placements to clients lacking the relevant risk
      appetite or financial capacity."

  - - "TASK 20: Advice and Portfolio Management (Art. 10 RTS) -- CONDITIONAL (H and/or I)"
    - "SKIP THIS TASK if neither service (H) advice nor service (I) portfolio
      management has been declared."
    - "Verify that the document provides evidence, or describes the framework for
      evidencing, that natural persons who will give advice or manage portfolios
      have the necessary knowledge and expertise: relevant professional
      qualifications, regulatory certifications, or substantive years of experience
      in crypto-asset markets or equivalent financial markets."
    - "Check that the suitability assessment process is described: how client
      knowledge and experience, financial situation, investment objectives, and risk
      tolerance are assessed; and how the entity ensures recommendations or
      investment decisions are suitable for the individual client."
    - "Confirm that the document describes how advice or portfolio management
      mandates are documented, how ongoing performance is reported to clients, and
      how clients can modify or terminate mandates."

  - - "TASK 21: Transfer Services (Art. 11 RTS) -- CONDITIONAL (J)"
    - "SKIP THIS TASK if service (J) transfer services has NOT been declared."
    - "Verify that the document describes the operational mechanics of the service:
      how transfer instructions are received from clients, how destination addresses
      are verified, applicable transaction limits, settlement timelines, and
      confirmation to the client."
    - "Check that travel rule compliance is described using [R6]: the entity must
      transmit originator information (name, DLT address, and for transfers
      >EUR 1,000: address/national ID/DoB) to the beneficiary CASP for every
      transfer; obtain beneficiary information for every incoming transfer; and
      maintain risk-based procedures for self-hosted wallet transfers. 'We comply
      with applicable law' without procedural detail is insufficient."
    - "Confirm that the document describes controls for failed, rejected, and
      suspicious transfers: triggers for rejection (sanctions hit, incomplete travel
      rule data, unhosted wallet risk), handling of assets pending investigation,
      client notification procedures, and STR filing where applicable."

  - - "TASK 22: Cross-Cutting Consistency and Quality Checks"
    - "Cross-reference the Task 1 declared-services checklist against Tasks 15-21.
      Every declared service must have a corresponding section with substantive
      content. Every conditional task skipped for a non-declared service must be
      noted as an intentional omission. Flag any declared service with no
      corresponding content anywhere in the document."
    - "Check internal consistency of forward-looking data: client volume projections
      (Task 7) must be directionally consistent with headcount plans (Task 9) and
      financial forecasts (Task 10). A forecast of rapid client growth with flat
      headcount, or a stress scenario less severe than the entity's own stated
      market volatility assumptions, are internal inconsistencies to flag."
    - "Verify that the three-year horizon is applied consistently across all
      forward-looking sections -- headcount plan, financial forecasts, client
      targets by geography, and stress scenarios must all cover the same period
      starting from the same reference date."
    - "Check that the document is self-contained or complete by reference: every
      policy mentioned (outsourcing policy, AML policy, conflicts of interest
      policy, execution policy, custody policy, BCP, marketing approval procedure)
      must either be described substantively within the PoO or explicitly identified
      as a separate document forming part of the application dossier. A list of
      policy titles without any description of their content is insufficient."
    - "Verify that every key role mentioned (MLRO, DPO, Internal Audit, board
      members, key management functions) is attributed to a named individual, or
      where the document is anonymised, that the role is described with reporting
      lines and functional responsibilities sufficient for supervisory assessment."
    - "Flag any section where the language is entirely generic and contains no
      entity-specific detail. Boilerplate sections that could apply to any CASP
      without modification should be identified for the applicant to revise with
      concrete, entity-specific operational content."

Tasks_v2_archived:

  - - "PHASE 1: Route, Legal Basis, and Service Matrix"
    - "Determine whether the submission is framed as an Art. 60 notification or an
      Art. 62 authorisation application. Use [R1] to verify whether the entity type
      is actually eligible for Art. 60. If the stated route is wrong, flag that as
      a material issue and explain which route should apply."
    - "Build a complete service matrix for MiCA services (A)-(J) showing which
      services are declared, which are expressly excluded, and which are ambiguous.
      Treat ambiguity as a gap because the rest of the review depends on this matrix."
    - "Verify that the document clearly states the legal basis for the submission:
      Regulation (EU) 2023/1114 (MiCA), Commission Delegated Regulation (EU)
      2025/303 (RTS), and for Art. 60 notifications the specific Art. 60 paragraph.
      Flag if the legal framing is generic, incomplete, or internally inconsistent."
    - "Check whether the Programme of Operations applies a consistent three-year
      planning horizon. If the horizon is absent, shorter, or inconsistent across
      forecasts, staffing, geography, and risk sections, treat that as a material
      quality defect."
    - "CONDITIONAL -- if the route is Art. 60: verify the service-by-service
      equivalence mapping using [R2]. For each declared service, determine whether
      the mapping is CONFIRMED, ASSERTED, or ABSENT based on whether the document
      cites the relevant MiFID II or directive annex reference."

  - - "PHASE 2: Entity Perimeter, Structure, and Strategic Narrative"
    - "Verify that the applicant's legal identity is fully described: legal name,
      LEI or equivalent, registered address, jurisdiction, legal form, ownership
      chain, UBO, and whether the applicant is standalone or part of a group."
    - "Check that all affiliated entities relevant to crypto-asset services are
      identified and that the operational impact of those relationships is described:
      shared ICT, intra-group outsourcing, shared brand, treasury, AML support,
      or other group dependencies."
    - "Assess whether the document explains why the applicant is entering
      crypto-asset services, how those services fit the wider business strategy,
      and whether they are a standalone business line or an extension of existing
      regulated activities."
    - "Verify that the document distinguishes MiCA-regulated services from
      ancillary or non-MiCA activities such as staking, DeFi interaction, NFTs,
      or other adjacent products. Flag if the perimeter is blurred."
    - "Check that the relationship between existing regulated activities and the
      new crypto-asset perimeter is explained with enough substance to assess
      internal demarcation, governance separation, and risk transfer boundaries."

  - - "PHASE 3: Clients, Geography, Market Approach, and Complaints"
    - "Verify that the intended geographic footprint is described with enough
      specificity for supervisory assessment: target jurisdictions, rationale,
      prioritisation, and any assumptions around cross-border distribution."
    - "Check that the target client base is segmented in a meaningful way
      (retail, professional, institutional, corporate, etc.) and that the access
      model is described across website, mobile, API, relationship managers,
      intermediaries, white-label, or other channels."
    - "Confirm that forward-looking client numbers are provided and are aligned
      with the stated geographic expansion and service mix. Flag if the client
      growth story is purely narrative or detached from the rest of the plan."
    - "Verify that marketing and promotional activity is described by channel,
      target audience, languages, and governance, including fair-clear-not-
      misleading principles, entity identification, and risk disclosure."
    - "Check whether the complaints handling framework is substantively described:
      intake, acknowledgement, investigation, escalation, response timing,
      root-cause analysis, and feedback into management reporting."

  - - "PHASE 4: Governance, Management Body, and Qualifying Holders"
    - "Verify that the governance structure is described in a way that allows a
      supervisor to understand decision-making, reporting lines, first line versus
      second line versus third line responsibilities, and who owns the crypto-
      asset business."
    - "Use [R9] to assess fit and proper coverage for the management body.
      Determine whether the document gives substantive evidence on reputation,
      sanctions history, relevant experience, time commitment, and collective
      suitability rather than only making high-level assertions."
    - "Check whether key control functions are identified: Compliance, Risk,
      Internal Audit, ICT/Security, AML/MLRO, and any safeguarding or custody
      oversight roles. Verify reporting lines, independence, and whether roles
      are internal or outsourced."
    - "Use [R10] to assess disclosure of qualifying holders. Verify the identity,
      ownership size, and fitness/repute assessment of each holder, or an explicit
      statement that no additional qualifying holders exist."
    - "Check for governance conflicts of interest, including founder-management
      overlap, group service providers, dual-hatting, weak segregation of control
      functions, or unclear committee structures."

  - - "PHASE 5: Resources, Prudential Position, and Outsourcing"
    - "Assess the adequacy of human resources across operations, compliance, AML,
      risk, ICT, security, custody, and client support. Verify both current
      staffing and the three-year staffing plan."
    - "Use [R3] to verify whether the prudential capital floor implied by the
      declared services is correctly reflected in the document. Also assess whether
      fixed-overheads logic, own-funds sufficiency, and financial resilience are
      explained with enough detail."
    - "Verify that ICT resources are described practically: what systems and
      providers are used, what is internal versus external, and who owns the
      operational responsibility for each critical capability."
    - "Use [R4] to assess outsourcing quality. Check provider identity, criticality,
      contractual protections, due diligence, audit rights, exit strategy, ongoing
      oversight, retained responsibility, and any third-country supervisory access
      concerns."
    - "Check whether outsourcing is proportionate or whether the operating model
      risks looking like a shell entity with weak internal control or weak
      management oversight."

  - - "PHASE 6: Funding, Forecasts, and Financial Resilience"
    - "Verify that the document provides a credible financial plan covering the
      three-year RTS horizon: revenue, costs, profitability, balance sheet,
      liquidity, and funding assumptions."
    - "Check whether the sources of funding are identified clearly enough to assess
      durability and prudential relevance: equity, retained earnings, external
      financing, intra-group loans, or shareholder support."
    - "Assess whether the forecast assumptions are directionally consistent with
      service scope, geography, client growth, resourcing, marketing activity, and
      outsourcing reliance."
    - "Verify that at least one business-model-relevant stress scenario is included
      and that it quantifies impact on income, capital, and liquidity rather than
      merely describing adverse events qualitatively."
    - "CONDITIONAL -- if exchange or principal dealing exposure exists: verify that
      treasury exposure, inventory management, hedging, and own-account risk are
      treated explicitly rather than being folded into generic revenue forecasts."

  - - "PHASE 7: Resilience, AML/CTF, and ICT Control Framework"
    - "Verify that the Business Continuity Plan includes a Business Impact Analysis,
      identification of critical functions, documented RTO/RPO, testing cadence,
      third-party failure scenarios, and a credible client asset return / wind-down
      process."
    - "Use [R8] to assess the AML/CTF framework: business-wide risk assessment,
      CDD, EDD, monitoring, sanctions screening, STR process, MLRO, training, and
      record retention. Treat generic statements without operational detail as gaps."
    - "Use [R6] to verify whether travel rule controls are described for applicable
      transfers, including originator/beneficiary data requirements, self-hosted
      wallet handling, and controls for incomplete or suspicious information."
    - "Use [R7] to assess ICT governance and DORA alignment: ICT risk policy,
      risk identification and mitigation, incident management, major incident
      reporting timelines, resilience testing, ICT third-party risk, and
      concentration risk."
    - "Verify that the document includes both a technical architecture view and a
      non-technical supervisory summary of ICT systems and cybersecurity controls."

  - - "PHASE 8: Safeguarding, Segregation, and Custody"
    - "Assess whether the document clearly prohibits own-account use of client
      assets and client funds, and whether that prohibition is backed by system,
      reconciliation, and governance controls rather than only policy language."
    - "Verify client-to-own and client-to-client segregation for crypto-assets and
      fiat funds, including wallet/account structure, accounting segregation,
      reconciliation design, and client disclosure."
    - "Assess the cryptographic key management model: generation, storage, hot/cold
      design, MPC or multi-sig use, backup, recovery, rotation, and approval
      workflows for asset movement."
    - "Use [R5] to assess the custody and administration policy where service (A)
      is in scope. Check risk identification, insurance/capital support, record-
      keeping, daily reconciliation, sub-custody controls, client reporting, and
      treatment of operational edge cases such as forks or returns."
    - "Verify deposit and withdrawal mechanics, insolvency or wind-down return
      arrangements, and whether clients receive clear safeguarding disclosures."

  - - "PHASE 9: Service-Specific Operating Model Review"
    - "For each declared service in the service matrix, assess whether the document
      provides a distinct operational model rather than only naming the service.
      Use undeclared services as conditional skips rather than automatic failures."
    - "CONDITIONAL -- if trading platform service (B) is declared: assess listing
      rules, access criteria, order types, fee logic, market surveillance, abuse
      detection, and escalation to compliance and competent authorities."
    - "CONDITIONAL -- if exchange services (C) and/or (D) are declared: assess the
      commercial policy, pricing methodology, liquidity sourcing, execution flow,
      principal-risk conflicts, and fairness controls."
    - "CONDITIONAL -- if execution of orders (E) is declared: assess best execution
      policy, venue/counterparty selection, OTC methodology, client consent,
      execution-quality monitoring, and protection against misuse of client order
      information."
    - "CONDITIONAL -- if placing (F), reception and transmission (G), advice (H),
      portfolio management (I), or transfer services (J) are declared: verify the
      relevant service mechanics, client protection controls, qualification or
      suitability requirements, transfer controls, and travel rule handling where
      applicable."

  - - "PHASE 10: Cross-Cutting Supervisory Synthesis"
    - "Cross-check the service matrix against all later sections. Every declared
      service should have substantive operating content, and every omitted service
      should be clearly out of scope."
    - "Check whether key assumptions are consistent across legal basis, service
      scope, geography, staffing, funding, forecast, continuity, AML, ICT, and
      safeguarding sections."
    - "Verify that policies mentioned in the Programme of Operations are either
      summarised substantively in the document or clearly identified as separate
      dossier items, rather than being listed without content."
    - "Check whether key roles are attributable to named individuals or at least to
      roles with clear reporting lines and responsibilities sufficient for
      supervisory assessment."
    - "Flag any sections that remain overly generic or boilerplate and identify the
      most material supervisory concerns that would likely prevent approval,
      require remediation, or cause scope limitation."

Tasks:

  - - "REQ-01: Route Eligibility And Correct Procedure"
    - "Determine whether the submission follows Art. 60 notification or Art. 62
      authorisation. Use [R1] to verify that the entity type is actually eligible
      for Art. 60. If the chosen route is incorrect, treat that as a material
      failure and explain the correct route."

  - - "REQ-02: Service Matrix And Explicit Scope"
    - "Identify which MiCA services (A)-(J) are declared, which are expressly
      excluded, and which remain ambiguous. Build the scope view from substance,
      not only headings. Treat ambiguity on service scope as a gap."

  - - "REQ-03: Legal Basis, Art. 60 Framing, And Planning Horizon"
    - "Verify that the document cites MiCA and the RTS correctly, and for Art. 60
      notifications confirms that the submission is a notification rather than a
      fresh authorisation application."
    - "Check whether the Programme of Operations applies a consistent three-year
      planning horizon across all forward-looking sections."

  - - "REQ-04: Existing Authorisation And Parallel Framework Demarcation"
    - "Verify that the existing licence, supervising authority, and authorisation
      basis are described, and that the document explains how the crypto-asset
      perimeter will operate alongside the existing regulated business without
      regulatory overlap or control dilution."

  - - "REQ-05: Legal Identity, Ownership, And UBO"
    - "Verify that the legal name, jurisdiction, legal form, registered address,
      ownership structure, and UBO are stated with enough precision for
      supervisory identification."

  - - "REQ-06: Group Perimeter And Affiliated Entities"
    - "Check whether the applicant is standalone or part of a group and whether
      all affiliated entities relevant to crypto-asset services are identified.
      If the applicant is standalone, confirm that is stated explicitly."

  - - "REQ-07: Operational Impact Of Group Or Affiliate Dependencies"
    - "Where group or affiliate relationships exist, verify whether the document
      explains their operational impact: shared ICT, treasury, outsourcing, AML
      support, shared brand, or other dependencies relevant to supervision."

  - - "REQ-08: Strategic Rationale For Entering Crypto-Asset Services"
    - "Verify that the document explains why the applicant is entering crypto-
      asset services, how those services fit the wider strategy, and whether the
      crypto perimeter is a standalone business line or an extension of existing
      capabilities."

  - - "REQ-09: Distinction Between MiCA And Non-MiCA Activities"
    - "Check whether staking, DeFi, NFTs, or other ancillary activities are
      clearly distinguished from MiCA-regulated services, including governance,
      conflicts, and disclosure boundaries where relevant."

  - - "REQ-10: Geographic Scope"
    - "Verify that target jurisdictions are identified with enough specificity for
      supervisory review and that the rationale for those jurisdictions is
      described."

  - - "REQ-11: Target Client Segments And Access Channels"
    - "Check whether the target client base is segmented meaningfully and whether
      the access channels to services are described clearly across website, app,
      API, relationship-led, or intermediary models."

  - - "REQ-12: Forward-Looking Client Numbers"
    - "Verify that the document provides forward-looking client number estimates
      over the planning horizon, and that those estimates align with the stated
      geography and service mix."

  - - "REQ-13: Complaints Handling"
    - "Verify that the complaints framework is described operationally: intake,
      acknowledgement, investigation, escalation, response timing, record-keeping,
      and root-cause analysis."

  - - "REQ-14: Marketing And Promotional Governance"
    - "Check whether marketing channels, target audiences, languages, governance,
      and fair-clear-not-misleading standards are described in a supervisoryly
      useful way."

  - - "REQ-15: Governance Structure And Reporting Lines"
    - "Verify that the governance structure is described clearly enough to show
      who owns the business, who reports to whom, and how responsibilities are
      allocated across management and control layers."

  - - "REQ-16: Management Body Individual Fit-And-Proper Evidence"
    - "Use [R9] to verify whether each management body member is supported by
      substantive fit-and-proper evidence rather than high-level assertions."

  - - "REQ-17: Collective Suitability And Time Commitment"
    - "Use [R9] to assess whether the document covers collective suitability,
      diversity of competence, and sufficient time commitment across the
      management body."

  - - "REQ-18: Control Functions And Independence"
    - "Verify whether Compliance, Risk, Internal Audit, ICT/Security, AML/MLRO,
      and any safeguarding oversight functions are identified, with reporting
      lines, internal versus outsourced status, and independence safeguards."

  - - "REQ-19: Qualifying Holders"
    - "Use [R10] to verify whether qualifying holders are identified, ownership
      sizes are disclosed, and repute/fitness coverage is provided, or whether an
      explicit statement is made that no additional qualifying holders exist."

  - - "REQ-20: Governance Conflicts Of Interest"
    - "Check whether governance-level conflicts are identified and mitigated,
      including founder-management overlap, dual-hatting, group providers, or
      weak segregation of control roles."

  - - "REQ-21: Current Staffing And Three-Year Headcount Plan"
    - "Verify whether staffing is described with enough detail to assess current
      adequacy and the credibility of the planned three-year resource model."

  - - "REQ-22: Prudential Capital And Own Funds"
    - "Use [R3] to assess whether the prudential capital floor implied by the
      declared services is reflected correctly and whether own-funds sufficiency
      is explained credibly."

  - - "REQ-23: ICT Resources And Operational Ownership"
    - "Verify that ICT resources are described practically: systems, providers,
      internal ownership, and which capabilities are core to service delivery."

  - - "REQ-24: Outsourcing Inventory And Criticality Classification"
    - "Verify that outsourced arrangements relevant to crypto-asset services are
      identified and that critical or important functions are distinguished from
      less material outsourcing."

  - - "REQ-25: Outsourcing Controls Under Art. 73 MiCA"
    - "Use [R4] to assess written agreements, due diligence, audit rights, exit
      planning, retained responsibility, ongoing oversight, and third-country
      supervisory access concerns."

  - - "REQ-26: Funding Sources"
    - "Verify that the document clearly explains how the crypto-asset business is
      funded initially and on an ongoing basis, including intra-group or external
      financing where relevant."

  - - "REQ-27: Forecast Completeness And Internal Consistency"
    - "Check whether the financial forecast covers the planning horizon with
      enough detail and whether it is internally consistent with client growth,
      staffing, geography, service scope, and outsourcing."

  - - "REQ-28: Stress Scenario And Own-Account Financial Risks"
    - "Verify that at least one relevant stress scenario is quantified for income,
      capital, and liquidity. CONDITIONAL -- where exchange or principal exposure
      exists, verify that treasury, inventory, or hedging risk is addressed."

  - - "REQ-29: Business Continuity, Third-Party Failure, And Wind-Down"
    - "Verify that the BCP covers critical functions, BIA, RTO/RPO, testing,
      third-party failure scenarios, and an operationally credible client asset
      return or wind-down process."

  - - "REQ-30: AML/CTF Core Framework"
    - "Use [R8] to assess whether the AML/CTF framework covers business-wide risk
      assessment, CDD, EDD, monitoring, sanctions screening, STR process,
      training, and record retention with real operational substance."

  - - "REQ-31: Crypto-Specific AML Risks, Travel Rule, And MLRO Governance"
    - "Use [R6] and [R8] to verify crypto-specific risk coverage, travel rule
      handling, self-hosted wallet controls, and whether the MLRO role has clear
      authority, independence, and reporting access."

  - - "REQ-32: ICT Architecture And Non-Technical Summary"
    - "Verify that the document provides both a technical ICT architecture view
      and a genuinely usable non-technical summary for supervisory readers."

  - - "REQ-33: ICT Risk Management, DORA Alignment, Testing, And Concentration Risk"
    - "Use [R7] to assess ICT risk policy, incident management, DORA-aligned
      reporting, resilience testing, ICT third-party oversight, and concentration
      risk where one provider supports multiple critical functions."

  - - "REQ-34: Safeguarding Prohibition And Segregation Model"
    - "Verify that own-account use of client assets is prohibited operationally
      and that client-to-own and client-to-client segregation is described with
      system, wallet/account, and reconciliation controls."

  - - "REQ-35: Key Management And Client Safeguarding Disclosures"
    - "Verify that key management is described with enough specificity to assess
      generation, storage, approval, backup, recovery, rotation, and that client
      safeguarding disclosures are explained."

  - - "REQ-36: Custody Policy Under Art. 75 MiCA"
    - "CONDITIONAL -- apply only if service (A) is in scope. Use [R5] to assess
      whether the custody policy covers operational and ICT risks, record-keeping,
      reconciliation, insurance or equivalent support, and return arrangements."

  - - "REQ-37: Custody Operations And Sub-Custody"
    - "CONDITIONAL -- apply only if service (A) is in scope. Verify deposit and
      withdrawal mechanics, sub-custody controls, ongoing oversight, and limits on
      onward delegation."

  - - "REQ-38: Trading Platform Rules And Market Abuse"
    - "CONDITIONAL -- apply only if service (B) is declared. Verify listing rules,
      participant access, order types, market surveillance, abuse monitoring, and
      escalation to compliance or competent authorities."

  - - "REQ-39: Exchange Services Operating Model"
    - "CONDITIONAL -- apply only if service (C) and/or (D) is declared. Verify
      commercial policy, pricing methodology, liquidity sourcing, execution flow,
      principal-risk conflicts, and fairness controls."

  - - "REQ-40: Execution Of Orders Operating Model"
    - "CONDITIONAL -- apply only if service (E) is declared. Verify best execution
      policy, venue/counterparty selection, OTC methodology, client consent,
      execution quality monitoring, and safeguards against misuse of order
      information."

  - - "REQ-41: Reception And Transmission / Placing"
    - "CONDITIONAL -- apply only if service (F) and/or (G) is declared. Verify
      order transmission or placing mechanics, target investor controls, best
      interest handling, conflicts management, and client disclosures."

  - - "REQ-42: Advice / Portfolio Management / Transfer Services"
    - "CONDITIONAL -- apply only if service (H), (I), and/or (J) is declared.
      Verify competence, suitability, mandate or transfer mechanics, and travel
      rule controls where transfer services are in scope."

  - - "REQ-43: Cross-Cutting Consistency"
    - "Cross-check the service matrix, staffing, forecast, geography, continuity,
      AML, ICT, and safeguarding sections for internal consistency. Flag where the
      document tells conflicting operational stories."

  - - "REQ-44: Dossier Completeness, Role Attribution, And Boilerplate"
    - "Verify that cited policies are either substantively summarised or clearly
      identified as separate dossier items, that key roles are attributable to
      identifiable persons or well-defined functions, and that material sections
      are not generic boilerplate."
